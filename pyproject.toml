
# Pip Build Setup --------------------------------------------------------------
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Pip Package Metadata ---------------------------------------------------------
[project]
name = "popmusic2"
version = "1.0.0"
description = "Run mutational DMS analysis with PoPMuSiC-2 and BeAtMuSiC."
readme = "README.md"
authors = [
  { name = "Matsvei Tsishyn", email = "matsvei.tsishyn@protonmail.com" },
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "littlecsv"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Programming Language :: C",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
urls = { Homepage = "https://github.com/MatsveiTsishyn/popmusic2" }

# Entry Points for CLI ---------------------------------------------------------
[project.scripts]
popmusic2 = "popmusic2.cli_popmusic2:main"
beatmusic = "popmusic2.cli_beatmusic:main"
popmusic2_complete_csv = "popmusic2.cli_popmusic2_complete_csv:main"
beatmusic_complete_csv = "popmusic2.cli_beatmusic_complete_csv:main"
music_help = "popmusic2.cli_music_help:main"
music_cat = "popmusic2.cli_music_cat:main"

# Setup pip Package ------------------------------------------------------------
# this finds all the python packages recursively
[tool.setuptools]
packages = { find = {} }
include-package-data = true
